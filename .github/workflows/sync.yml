name: Sync & Build AIO Package

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Set Date Tag
        id: date
        run: echo "DATE_TAG=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_ENV

      - name: Run update_store.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python update_store.py

      - name: Run generate_web.py
        run: |
          python generate_web.py

      # --- Build des 4 Zips Individuels ---
      - name: Build AIO Payloads Package (.zip)
        env:
          DATE_TAG: ${{ env.DATE_TAG }}
        run: python build_aio_package.py

      - name: Build AIO PKG Package (.zip)
        env:
          DATE_TAG: ${{ env.DATE_TAG }}
        run: python build_aio_package_pkg.py

      - name: Build AIO FFPFSC Package (.zip)
        env:
          DATE_TAG: ${{ env.DATE_TAG }}
        run: python build_aio_package_ffpfsc.py

      - name: Build AIO Apps Package (.zip)
        env:
          DATE_TAG: ${{ env.DATE_TAG }}
        run: python build_aio_package_apps.py

      # --- Build du Zip Ultime (Contient les 4 zips) ---
      - name: Build Ultimate Pack AIO (.zip)
        env:
          DATE_TAG: ${{ env.DATE_TAG }}
        run: python build_aio_ultimate.py

      - name: Generate Release Notes
        run: |
          echo "## 🚀 Nouveautés & Contenu de cette Build" > release_notes.md
          echo "" >> release_notes.md
          if [ -f "json/pkg.json" ]; then
            echo "### 📦 Packages PKG Inclus" >> release_notes.md
            python -c "import json; data=json.load(open('json/pkg.json')); print('\n'.join([f'- **{p[\"name\"]}** ({p.get(\"version\", \"v1.0.0\")})' for p in data.get('packages', [])]))" >> release_notes.md
            echo "" >> release_notes.md
          fi
          if [ -f "json/ffpfsc.json" ]; then
            echo "### 📄 Fichiers FFPFSC Inclus" >> release_notes.md
            python -c "import json; data=json.load(open('json/ffpfsc.json')); print('\n'.join([f'- **{p[\"name\"]}** ({p.get(\"version\", \"v1.0.0\")})' for p in data.get('files', [])]))" >> release_notes.md
            echo "" >> release_notes.md
          fi
          if [ -f "json/apps.json" ]; then
            echo "### 📱 Applications Incluses" >> release_notes.md
            python -c "import json; data=json.load(open('json/apps.json')); print('\n'.join([f'- **{p[\"name\"]}** ({p.get(\"version\", \"v1.0.0\")})' for p in data.get('apps', [])]))" >> release_notes.md
            echo "" >> release_notes.md
          fi
          if [ -f "json/payloads.json" ]; then
            echo "### ⚡ Payloads Inclus" >> release_notes.md
            python -c "import json; data=json.load(open('json/payloads.json')); print('\n'.join([f'- **{p[\"name\"]}** ({p.get(\"version\", \"v1.0.0\")}) - {p.get(\"category\", \"\")}' for p in data.get('payloads', [])]))" >> release_notes.md
          fi

      - name: Commit and push updated JSONs, Web & README
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          [ -d "json" ] && git add json/
          [ -d "payloads" ] && git add payloads/
          [ -d "docs" ] && git add docs/
          [ -d "rss" ] && git add rss/
          [ -f "README.md" ] && git add README.md
          [ -f "index.html" ] && git add index.html
          
          git commit -m "auto: update stores, payloads, web site & readme [skip ci]" || echo "No changes to commit"
          git push

      # --- 1. Release Fixe "latest" ---
      - name: Update 'latest' Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest"
          name: "PS5 AIO Packages (Dernière version)"
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            PS5_ultimate_pack_aio_latest.zip
            PS5_payloads_aio_latest.zip
            PS5_pkg_aio_latest.zip
            PS5_ffpfsc_aio_latest.zip
            PS5_apps_aio_latest.zip
            json/payloads.json
            json/pkg.json
            json/ffpfsc.json
            json/apps.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- 2. Release Horodatée avec le TAG Date-Time ---
      - name: Create Horodated Tag
        run: |
          git tag -f "aio-${{ env.DATE_TAG }}"
          git push origin "aio-${{ env.DATE_TAG }}" --force

      - name: Create Horodated Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "aio-${{ env.DATE_TAG }}"
          name: "PS5 AIO Packages (${{ env.DATE_TAG }})"
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            PS5_ultimate_pack_aio_${{ env.DATE_TAG }}.zip
            PS5_payloads_aio_${{ env.DATE_TAG }}.zip
            PS5_pkg_aio_${{ env.DATE_TAG }}.zip
            PS5_ffpfsc_aio_${{ env.DATE_TAG }}.zip
            PS5_apps_aio_${{ env.DATE_TAG }}.zip
            json/payloads.json
            json/pkg.json
            json/ffpfsc.json
            json/apps.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
