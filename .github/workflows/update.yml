name: Auto Update Store & Packages

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-store:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Configuration du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 2. Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 4. Installation du CLI GitHub (gh)
        run: |
          type -p curl >/dev/null || (sudo apt update && sudo apt install curl -y)
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh -y

      - name: 5. Authentification GitHub CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: 6. Lancement de la mise à jour globale
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: python update_store.py

      - name: 7. Commit et Push du code source et des binaires
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add json/ rss/ index.html README.md scripts/ feed/ payloads/ archives/ 2>/dev/null || true
          git diff-index --quiet HEAD || (git commit -m "🤖 Auto-update store, RSS, Web, Payloads & Packages [skip ci]" && git push)

      - name: 8. Nettoyage et Publication des Releases avec listes détaillées
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(date +'%Y.%m.%d-%H%M')"
          
          # Génération de la liste détaillée des fichiers pour les notes de version
          PAYLOADS_LIST=$(find payloads/ -type f 2>/dev/null | sed 's/^/- /' || echo "Aucun")
          ARCHIVES_LIST=$(find archives/ -name "*_latest.zip" -exec basename {} \; 2>/dev/null | sed 's/^/- /' || echo "Aucun")

          RELEASE_NOTES="### 🚀 Synthèse de la mise à jour ($TAG)
          
          Le store PlayStation 5 a été mis à jour avec succès.
          
          #### 📦 Archives AIO Disponibles :
          $ARCHIVES_LIST

          #### 📂 Fichiers inclus / mis à jour :
          <details>
          <summary>Voir la liste détaillée des payloads</summary>

          $PAYLOADS_LIST
          </details>"

          # Nettoyage radical de TOUTES les anciennes releases et tags du dépôt pour ne garder que le strict nécessaire
          echo "🧹 Suppression des anciennes releases et tags..."
          for rel in $(gh release list --limit 100 --json tagName -q ".[].tagName"); do
            gh release delete "$rel" --yes || true
            git push origin --delete "$rel" || true
            git tag -d "$rel" || true
          done

          # Création du nouveau tag horodaté
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git tag "$TAG"
          git push origin "$TAG"

          files_latest=$(ls archives/*_latest.zip 2>/dev/null || true)

          # 1. Publication de la release horodatée unique
          if [ -n "$files_latest" ]; then
            gh release create "$TAG" $files_latest \
              --title "PS5 Store AIO Release ($TAG)" \
              --notes "$RELEASE_NOTES"
          fi

          # 2. Publication de la release permanente 'latest'
          if [ -n "$files_latest" ]; then
            gh release create latest $files_latest \
              --title "PS5 Store AIO - Latest (Permanent)" \
              --notes "Liens permanents pointant toujours vers les dernières versions actualisées du store." \
              --latest
          fi
