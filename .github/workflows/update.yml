name: Auto Update Store & Packages

on:
  schedule:
    - cron: '0 */6 * * *'  # S'exécute toutes les 6 heures
  workflow_dispatch:        # Permet le lancement manuel depuis GitHub

permissions:
  contents: write

jobs:
  update-store:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Configuration du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 2. Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 4. Installation du CLI GitHub (gh)
        run: |
          type -p curl >/dev/null || (sudo apt update && sudo apt install curl -y)
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh -y

      - name: 5. Authentification GitHub CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: 6. Lancement de la mise à jour globale (Scripts & JSONs)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python update_store.py

      - name: 7. Génération de tous les packages AIO
        run: |
          python build_aio_package_payloads.py || echo "⚠️ build_aio_package_payloads skipped"
          python build_aio_package_pkg.py || echo "⚠️ build_aio_package_pkg skipped"
          python build_aio_package_ffpfsc.py || echo "⚠️ build_aio_package_ffpfsc skipped"
          python build_aio_package_apps.py || echo "⚠️ build_aio_package_apps skipped"
          python build_aio_ultimate.py || echo "⚠️ build_aio_ultimate skipped"

      - name: 8. Commit et Push du code source et des JSONs
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add json/ rss/ index.html README.md scripts/ feed/ 2>/dev/null || true
          git diff-index --quiet HEAD || (git commit -m "🤖 Auto-update store, RSS, Web [skip ci]" && git push)

      - name: 9. Publication des archives ZIP dans les Releases GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(date +'%Y.%m.%d-%H%M')"
          
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git tag "$TAG"
          git push origin "$TAG"

          # 1. Création de la release horodatée
          files_versioned=$(ls archives/*_${TAG#v}.zip 2>/dev/null || true)
          if [ -n "$files_versioned" ]; then
            gh release create "$TAG" $files_versioned \
              --title "PS5 Store AIO Release ($TAG)" \
              --notes "Archives AIO générées automatiquement."
          else
            echo "⚠️ Aucun fichier horodaté trouvé pour la release $TAG."
          fi

          # 2. Gestion de la release 'latest' (fichiers permanents)
          gh release delete latest --yes || true
          git push origin :refs/tags/latest || true
          
          files_latest=$(ls archives/*_latest.zip 2>/dev/null || true)
          if [ -n "$files_latest" ]; then
            gh release create latest $files_latest \
              --title "PS5 Store AIO - Latest (Permanent)" \
              --notes "Liens permanents pointant toujours vers les dernières versions actualisées." \
              --latest
          else
            echo "⚠️ Aucun fichier 'latest' trouvé pour la release permanente."
          fi
