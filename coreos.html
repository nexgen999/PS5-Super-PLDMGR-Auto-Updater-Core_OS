<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <meta name="description" content="evoX Core OS — configurable GitHub repository web dashboard">
  <link rel="icon" href="./web/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./web/css/style.css">
  <title>evoX Core OS</title>
</head>
<body>
  <div id="app" class="app-shell">
    <aside id="sidebar" class="sidebar">
      <div class="brand-mini">
        <img id="brand-logo" src="./web/assets/logo.svg" alt="">
        <div><strong id="brand-title">evoX</strong><span id="brand-subtitle">Core OS</span></div>
      </div>
      <div id="profile" class="profile-card skeleton-card"></div>
      <nav id="main-nav" class="main-nav" aria-label="Navigation"></nav>
      <div id="sidebar-bottom"></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="mobile-menu" class="icon-button" aria-label="Ouvrir le menu">☰</button>
        <div class="crumbs"><span id="page-kicker">Dashboard</span><b id="page-title">Home</b></div>
        <div class="top-actions">
          <button id="theme-toggle" class="icon-button" title="Changer le thème">◐</button>
          <a id="github-top" class="top-link" target="_blank" rel="noopener">GitHub ↗</a>
        </div>
      </header>

      <section id="content" class="content" aria-live="polite"></section>
    </main>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="./web/js/app.js"></script>
</body>
</html>
